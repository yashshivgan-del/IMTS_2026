<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Karini · Block Sorting Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Fira Code', monospace;
  background: #14161a;
  color: #c8cdd5;
  overflow: hidden;
  height: 100vh;
}
#layout {
  display: grid;
  grid-template-columns: 1fr 320px;
  height: 100vh;
}
#scene {
  position: relative;
}
#view {
  width: 100%;
  height: 100%;
  display: block;
}
#narration {
  position: absolute;
  bottom: 20px;
  left: 20px;
  font-size: 14px;
  color: #f0a53a;
  opacity: 0.9;
}
#header {
  position: absolute;
  top: 16px;
  left: 20px;
}
#header small {
  color: #5f7794;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
#header h1 {
  font-size: 18px;
  font-weight: 600;
  margin-top: 2px;
}

/* Sidebar */
aside {
  background: #1a1d22;
  border-left: 1px solid #2b313a;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.section-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #5f7794;
  margin-bottom: 8px;
}
.status-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 3px 0;
}
.status-val {
  color: #fff;
  font-weight: 500;
}

/* Blocks display */
.block-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  background: #22262d;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 13px;
}
.block-dot {
  width: 16px;
  height: 16px;
  border-radius: 3px;
}
.block-pos {
  margin-left: auto;
  color: #5f7794;
  font-size: 11px;
}

/* Slots */
.slot-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  background: #22262d;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 13px;
}
.slot-marker {
  width: 16px;
  height: 16px;
  border: 2px dashed #5f7794;
  border-radius: 3px;
}

/* Sort controls */
.sort-btn {
  width: 100%;
  padding: 10px;
  background: #f0a53a;
  color: #14161a;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 6px;
}
.sort-btn:hover { background: #f5b94e; }
.sort-btn:disabled { background: #3f4d63; color: #5f7794; cursor: not-allowed; }
.reset-btn {
  width: 100%;
  padding: 8px;
  background: #2b313a;
  color: #c8cdd5;
  border: 1px solid #3f4d63;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.reset-btn:hover { background: #3f4d63; }

/* Log */
#log {
  font-size: 11px;
  color: #5f7794;
  max-height: 150px;
  overflow-y: auto;
  line-height: 1.6;
}
#log .entry { border-bottom: 1px solid #22262d; padding: 3px 0; }
#log .entry.success { color: #22c55e; }
#log .entry.error { color: #ef4444; }
</style>
</head>
<body>
<div id="layout">
  <div id="scene">
    <canvas id="view"></canvas>
    <div id="header">
      <small>Karini · AI-Directed Sorting</small>
      <h1>Block Sorting Cell</h1>
    </div>
    <div id="narration"></div>
  </div>

  <aside>
    <div>
      <div class="section-title">Cell</div>
      <div class="status-row"><span>State</span><span class="status-val" id="s-state">--</span></div>
      <div class="status-row"><span>Backend</span><span class="status-val" id="s-backend">--</span></div>
      <div class="status-row"><span>Gripper</span><span class="status-val" id="s-gripper">--</span></div>
      <div class="status-row"><span>Held</span><span class="status-val" id="s-held">--</span></div>
    </div>

    <div>
      <div class="section-title">Blocks</div>
      <div id="block-list"></div>
    </div>

    <div>
      <div class="section-title">Target Slots</div>
      <div id="slot-list"></div>
    </div>

    <div>
      <div class="section-title">Sort Command</div>
      <button class="sort-btn" id="btn-sort" onclick="runSort()">
        Sort: Green → Red → Yellow
      </button>
      <button class="sort-btn" id="btn-sort2" onclick="runSort2()">
        Sort: Yellow → Green → Red
      </button>
      <button class="reset-btn" onclick="resetBlocks()">Reset Blocks</button>
    </div>

    <div>
      <div class="section-title">Activity Log</div>
      <div id="log"></div>
    </div>
  </aside>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
